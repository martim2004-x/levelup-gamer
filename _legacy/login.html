<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Level-Up Gamer</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-marca {
      text-align: center;
      margin-bottom: var(--space-3);
    }
    .login-marca img {
      width: 110px;
      margin-inline: auto;
    }
  </style>
</head>
<body>

  <header class="header">
    <nav class="navbar contenedor" aria-label="Navegación principal">
      <a href="index.html" class="navbar__logo">
        <img src="img/general/logo.png" alt="Logo Level-Up Gamer">
        <span>LEVEL-UP GAMER</span>
      </a>
      <button class="navbar__toggle" aria-label="Abrir menú de navegación" aria-expanded="false">☰</button>
      <ul class="navbar__menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="blogs.html">Blogs</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html" class="activo">Iniciar sesión</a></li>
        <li><a href="registro.html">Registrarse</a></li>
      </ul>
      <div class="navbar__acciones">
        <a href="carrito.html" class="navbar__carrito" aria-label="Ver carrito de compras">
          🛒 Cart (<span class="badge-carrito">0</span>)
        </a>
      </div>
    </nav>
  </header>

  <main class="main">
    <div class="contenedor seccion">
      <div class="login-marca">
        <img src="img/general/logo.png" alt="Logo Level-Up Gamer">
        <h1>Level-Up Gamer</h1>
      </div>

      <form class="formulario" id="form-login" novalidate>
        <h2 class="formulario__titulo">Inicio de sesión</h2>

        <div class="campo">
          <label for="correo-login">Correo</label>
          <input type="email" id="correo-login" name="correo" maxlength="100" placeholder="nombre@duoc.cl" required>
          <span class="campo__mensaje"></span>
        </div>

        <div class="campo">
          <label for="contrasena-login">Contraseña</label>
          <input type="password" id="contrasena-login" name="contrasena" minlength="4" maxlength="10" required>
          <span class="campo__ayuda">Entre 4 y 10 caracteres.</span>
          <span class="campo__mensaje"></span>
        </div>

        <p id="mensaje-general-login" class="campo__mensaje" role="alert"></p>

        <button type="submit" class="btn btn-primario btn-bloque">Iniciar sesión</button>

        <p class="texto-centro mt-3">
          ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="contenedor">
      <p class="footer__bottom">&copy; 2026 Level-Up Gamer. Todos los derechos reservados. Proyecto académico DSY1104.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/validaciones.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("form-login");
      const correo = document.getElementById("correo-login");
      const contrasena = document.getElementById("contrasena-login");
      const mensajeGeneral = document.getElementById("mensaje-general-login");

      validarEnTiempoReal(correo, (v) => validarRequerido(v) || validarLargoMaximo(v, 100) || validarCorreoInstitucional(v));
      validarEnTiempoReal(contrasena, (v) => validarRequerido(v) || validarRangoLargo(v, 4, 10));

      form.addEventListener("submit", (evento) => {
        evento.preventDefault();

        const correoValido = validarCampo(correo, (v) => validarRequerido(v) || validarLargoMaximo(v, 100) || validarCorreoInstitucional(v));
        const contrasenaValida = validarCampo(contrasena, (v) => validarRequerido(v) || validarRangoLargo(v, 4, 10));

        if (!correoValido || !contrasenaValida) {
          mensajeGeneral.textContent = "Revisa los datos ingresados.";
          mensajeGeneral.className = "campo__mensaje campo__mensaje--error";
          return;
        }

        // Esta es una SIMULACIÓN de login sin backend, como corresponde a la
        // entrega 1 (solo frontend). Cualquier correo/contraseña válidos según
        // el formato pasan la validación; la autenticación real llegará con
        // la base de datos en una evaluación posterior.
        mensajeGeneral.textContent = "Inicio de sesión simulado correctamente. Redirigiendo...";
        mensajeGeneral.className = "campo__mensaje campo__mensaje--ok";
        setTimeout(() => (window.location.href = "index.html"), 1200);
      });
    });
  </script>
</body>
</html>
